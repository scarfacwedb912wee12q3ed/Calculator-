<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body >
    <i id="MOON" class="fa-solid fa-sun"></i>

    <div class="calculator">
        <div class="output">
            <p id="privous"></p>
            <p id="current-number">0</p>
        </div>

        <button class="operatorr">-</button>
        <button class="grn" id="allClear">AC</button>
        
        <button class="grn" id="OneCLear">C</button>
        
        <button class="operatorr">÷</button>
        
        <button class="grn" data-number>7</button>
        <button class="grn" data-number>8</button>
        <button class="grn" data-number>9</button>
        
        <button class="operatorr">+</button>
        
        <button class="grn" data-number>4</button>
        <button class="grn" data-number>5</button>
        <button class="grn" data-number>6</button>
        
        <button class="operatorr">⨯</button>
        
        <button class="grn" data-number>1</button>
        <button class="grn" data-number>2</button>
        <button class="grn" data-number>3</button>
        
        <button class="grn" id="decimal">.</button>

        <button class="grn" data-number>0</button>

        <button class="equal" id="equals">=</button>

    </div>

<script src="./script.js"></script>
</body>
</html>
